name: Collect live status

on:
  # Scheduled collection is disabled because live status is collected locally.
  # Re-enable this schedule only if GitHub Actions should become the collector again.
  # schedule:
  #   - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect-live-status
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: catcher

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show current time
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo

          print("Asia/Taipei:", datetime.now(ZoneInfo("Asia/Taipei")).isoformat())
          PY

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Initialize databases
        run: |
          mkdir -p ../database/main
          python src/init_db.py
          python src/init_streamer_config.py

      - name: Collect live status
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          YOUTUBE_COLLECTOR_DEBUG: "1"
        run: python src/collect_all.py

      - name: Save collected databases as an Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: collected-databases
          path: |
            database/main/live_data.db
            database/main/streamer_config.db
          retention-days: 7
